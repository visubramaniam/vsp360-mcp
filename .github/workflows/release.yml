name: Release

# Pushing a v* tag builds every package, attaches them to the tag's GitHub release
# (created from the tag's CHANGELOG.md section if it does not exist yet) and pushes the
# multi-arch Docker image. Run it by hand to rebuild the packages for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.15
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: docker.io/subramaniamv/vsp360-mcp

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="$VERSION" '$0 ~ "^## " { f = (index($0, "## " v " ") == 1) ; next } f' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "Release $VERSION" > notes.md
            gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" release/*.tgz release/*.mcpb release/*.tar.gz release/*.zip release/SHA256SUMS --clobber

  docker:
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - name: Check for Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; skipping the Docker image"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.present
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.present
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.present
      - uses: docker/login-action@v3
        if: steps.creds.outputs.present
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.present
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.packages.outputs.version }}
            ${{ env.IMAGE }}:latest
