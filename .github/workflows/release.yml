name: Release

# Pushing a v* tag builds every package, attaches them to the tag's GitHub release
# (created from the tag's CHANGELOG.md section if it does not exist yet), publishes the npm
# package unless that version is already on npm, and pushes the multi-arch Docker image to
# ghcr.io (and Docker Hub when its credentials are set).
# The Windows packages are then tested on Windows x64 and arm64 machines (windows.yml).
# Run it by hand to rebuild the packages for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.15
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: docker.io/subramaniamv/vsp360-mcp
  GHCR_IMAGE: ghcr.io/visubramaniam/vsp360-mcp

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="$VERSION" '$0 ~ "^## " { f = (index($0, "## " v " ") == 1) ; next } f' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "Release $VERSION" > notes.md
            gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" release/*.tgz release/*.mcpb release/*.tar.gz release/*.zip release/SHA256SUMS --clobber

  npm:
    # Publishes the exact .tgz attached to the release, using npm trusted publishing: npm checks
    # this workflow's OIDC token, so no npm token is stored, and adds a provenance attestation.
    # The trusted publisher is configured on npmjs.com (package settings, workflow release.yml).
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          if npm view "vsp360-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "vsp360-mcp@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          gh release download "$TAG" --pattern "vsp360-mcp-$VERSION.tgz" --pattern SHA256SUMS
          grep " vsp360-mcp-$VERSION.tgz$" SHA256SUMS | sha256sum -c -
          npm install -g npm@11.6.2
          npm publish "vsp360-mcp-$VERSION.tgz" --access public

  windows:
    # Tests the release's Windows packages on Windows x64 and arm64 machines.
    needs: packages
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  docker:
    # Always pushes to GitHub Container Registry with the workflow's own token; also pushes to
    # Docker Hub when its credentials are set.
    runs-on: ubuntu-latest
    needs: packages
    # A normal build takes a few minutes; fail instead of hanging for hours if a step stalls.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Choose registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          tags="$GHCR_IMAGE:$VERSION,$GHCR_IMAGE:latest"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            tags="$tags,$IMAGE:$VERSION,$IMAGE:latest"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; pushing to ghcr.io only"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.registries.outputs.dockerhub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.registries.outputs.tags }}
