name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  package:
    # Builds the npm package, the Claude Desktop extension and one standalone package to catch packaging breakage
    # early. The standalone build checks the signature of the Node.js runtime's SHASUMS256.txt, and the
    # package is then smoke-tested against a mock VSP 360, as the Release workflow does for the Windows packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run package -- --targets linux-x64
      - name: Smoke-test the standalone package
        run: |
          version=$(node -p 'require("./package.json").version')
          tar -xzf "release/vsp360-mcp-$version-linux-x64.tar.gz" -C release
          node tests/smoke/package-smoke.mjs "release/vsp360-mcp-$version-linux-x64" "$version"
